<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Cámara retro 3D</title>
<style>
:root{--bg:#181433;--pn:#2c2760;--hi:#4b44a0;--lo:#0d0a22;--tx:#efe9d2;--ac:#f2c14e;--rec:#e8383d;--bt:#bdbad6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:700 14px "Courier New",ui-monospace,monospace;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:8px}
#out{max-width:100%;max-height:100%;image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid var(--hi);border-right-color:var(--lo);border-bottom-color:var(--lo);background:#000;touch-action:none}
#v{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#hud{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:var(--lo);padding:4px 10px;border:2px solid var(--rec);color:var(--rec);display:none;white-space:nowrap}
#hud.on{display:block}
#hud i{display:inline-block;width:9px;height:9px;background:var(--rec);margin-right:6px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#msg{position:absolute;bottom:14px;left:14px;right:14px;text-align:center;background:var(--lo);border:2px solid var(--ac);padding:6px;display:none}
#bar{display:flex;gap:8px;justify-content:center;align-items:center;padding:10px;background:var(--pn);border-top:3px solid var(--hi)}
button{font:inherit;color:#1b1840;background:var(--bt);border:3px solid;border-color:#fff #6e6a94 #6e6a94 #fff;padding:10px 12px;min-width:56px;cursor:pointer;touch-action:manipulation}
button:active,button.on{border-color:#6e6a94 #fff #fff #6e6a94;background:#a5a2c8}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.45}
#shut{width:72px;height:72px;border-radius:50%;background:var(--ac)}
#rec.on{background:var(--rec);color:#fff}
#panel{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow:auto;background:var(--pn);border-top:3px solid var(--ac);padding:12px 16px;transform:translateY(105%);transition:transform .2s steps(5);z-index:5}
#panel.open{transform:none}
.row{display:grid;grid-template-columns:1fr 54px;gap:2px 8px;margin-bottom:8px}
.row label{grid-column:1/-1}
.row span{text-align:right;color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac)}
.pre{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.pre button{padding:6px 8px;font-size:12px}
#prev{position:fixed;inset:0;background:rgba(13,10,34,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9;padding:16px}
#prev.on{display:flex}
#prev img,#prev video{max-width:90%;max-height:68%;image-rendering:pixelated;border:4px solid var(--hi)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
@media (orientation:landscape) and (min-width:700px){
 body{flex-direction:row}
 #bar{order:2;flex-direction:column;border-top:0;border-left:3px solid var(--hi)}
 #panel{left:auto;width:320px;top:0;max-height:none;border-top:0;border-left:3px solid var(--ac);transform:translateX(105%)}
 #panel.open{transform:none}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}#hud i{animation:none}}
</style>
</head>
<body>
<div id="stage">
 <canvas id="out"></canvas>
 <video id="v" playsinline muted autoplay></video>
 <div id="hud"><i></i><span id="tm">00:00 / 00:30</span></div>
 <div id="msg"></div>
 <div id="panel">
  <div class="pre" id="pre"></div>
  <div id="ctl"></div>
  <label><input type="checkbox" id="lofi"> Audio lo-fi (filtro y compresión retro)</label>
 </div>
</div>
<div id="bar">
 <button id="flip" title="Cambiar cámara">Girar</button>
 <button id="mic" title="Micrófono">Mic: on</button>
 <button id="shut" title="Tomar foto">Foto</button>
 <button id="rec" title="Grabar video">Grabar</button>
 <button id="fmt" title="Formato de salida">3:4</button>
 <button id="cfg" title="Ajustes">Ajustes</button>
</div>
<div id="prev"><div id="pc"></div><div><button id="sv">Guardar</button> <button id="cl">Cerrar</button></div></div>
<div id="flash"></div>
<script>
const $=s=>document.querySelector(s);
const vid=$('#v'),out=$('#out'),octx=out.getContext('2d');
const low=document.createElement('canvas'),lctx=low.getContext('2d',{willReadFrequently:true});
const S={px:240,lv:32,dith:.8,con:1.15,sat:1.2,mono:false,facing:'user',fmt:innerHeight>innerWidth?0:1};
const FMT=[[960,1280,'3:4'],[1280,960,'4:3'],[1080,1080,'1:1']];
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const GB=[[15,56,15],[48,98,48],[139,172,15],[155,188,15]];
const CTRL=[['px','Resolución (ancho en px)',120,360,10],['lv','Niveles de color (32 = RGB555)',2,32,1],['dith','Intensidad del dithering',0,1.5,.05],['con','Contraste',.5,2,.05],['sat','Saturación',0,2.5,.05]];
const PRE={
 'PS1 Classic':{px:240,lv:32,dith:.8,con:1.15,sat:1.2,mono:false},
 'PC 256 colores':{px:320,lv:6,dith:.6,con:1.1,sat:1.1,mono:false},
 'N64 Soft':{px:200,lv:32,dith:.3,con:1,sat:1.1,mono:false},
 'GameBoy Mono':{px:160,lv:4,dith:.7,con:1.2,sat:1,mono:true}};
let vtrack=null,atrack=null,rec=null,chunks=[],timer=null,actx=null,blobUrl=null,blobName='',recT0=0;

function msg(t,ms=4000){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',ms)}
function resize(){
 const [W,H,l]=FMT[S.fmt];
 if(out.width!==W||out.height!==H){out.width=W;out.height=H}
 low.width=S.px;low.height=Math.round(S.px*H/W);
 $('#fmt').textContent=l;
}
function frame(){
 requestAnimationFrame(frame);
 if(vid.readyState<2||!vid.videoWidth)return;
 const W=low.width,H=low.height,vw=vid.videoWidth,vh=vid.videoHeight,ar=W/H;
 let sw=vw,sh=vw/ar;if(sh>vh){sh=vh;sw=vh*ar}
 lctx.imageSmoothingEnabled=false;
 lctx.save();
 if(S.facing==='user'){lctx.translate(W,0);lctx.scale(-1,1)}
 lctx.drawImage(vid,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,W,H);
 lctx.restore();
 const id=lctx.getImageData(0,0,W,H),d=id.data;
 const step=255/(S.lv-1),c=S.con,sa=S.sat,di=S.dith,mono=S.mono;
 for(let y=0,i=0;y<H;y++){
  for(let x=0;x<W;x++,i+=4){
   const b=BAYER[(y&3)*4+(x&3)]/16-.47;
   let r=d[i],g=d[i+1],bl=d[i+2];
   const l=.299*r+.587*g+.114*bl;
   if(mono){
    let v=(l-128)*c+128+b*64*di;
    v=v<0?0:v>255?255:v;
    const p=GB[Math.min(3,(v/64)|0)];
    d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];continue;
   }
   const t=b*step*di;
   r=((l+(r-l)*sa)-128)*c+128+t;
   g=((l+(g-l)*sa)-128)*c+128+t;
   bl=((l+(bl-l)*sa)-128)*c+128+t;
   r=r<0?0:r>255?255:r;g=g<0?0:g>255?255:g;bl=bl<0?0:bl>255?255:bl;
   d[i]=Math.round(r/step)*step;
   d[i+1]=Math.round(g/step)*step;
   d[i+2]=Math.round(bl/step)*step;
  }
 }
 lctx.putImageData(id,0,0);
 octx.imageSmoothingEnabled=false;
 octx.drawImage(low,0,0,out.width,out.height);
}

/* Cámara y micrófono */
async function startCam(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('Este navegador no permite usar la cámara. Abre el archivo desde HTTPS o localhost.',8000);return}
 if(vtrack)vtrack.stop();
 try{
  const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:S.facing},width:{ideal:1280},height:{ideal:1280}},audio:false});
  vtrack=st.getVideoTracks()[0];
  vid.srcObject=st;
  await vid.play();
 }catch(e){msg('No se pudo abrir la cámara: '+e.message+'. Revisa los permisos del navegador.',8000)}
}
async function startMic(){
 try{
  const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  atrack=st.getAudioTracks()[0];
 }catch(e){
  atrack=null;$('#mic').disabled=true;$('#mic').textContent='Sin mic';
  msg('Micrófono denegado: la cámara funciona, pero los videos no tendrán audio.',6000);
 }
}
$('#flip').onclick=()=>{S.facing=S.facing==='user'?'environment':'user';startCam()};
$('#mic').onclick=()=>{
 if(!atrack)return;
 atrack.enabled=!atrack.enabled;
 $('#mic').textContent=atrack.enabled?'Mic: on':'Mic: off';
 $('#mic').classList.toggle('on',!atrack.enabled);
};

/* Ajustes */
const ctl=$('#ctl');
CTRL.forEach(([k,n,mn,mx,st])=>{
 ctl.insertAdjacentHTML('beforeend',`<div class="row"><label for="s_${k}">${n}</label><input type="range" id="s_${k}" min="${mn}" max="${mx}" step="${st}"><span id="o_${k}"></span></div>`);
 $('#s_'+k).oninput=e=>{S[k]=parseFloat(e.target.value);S.mono=false;syncUI();if(k==='px')resize()};
});
function syncUI(){
 CTRL.forEach(([k])=>{
  $('#s_'+k).value=S[k];
  $('#o_'+k).textContent=k==='px'?S[k]:k==='lv'?S[k]:k==='dith'?Math.round(S[k]*100)+'%':S[k].toFixed(2);
 });
}
Object.keys(PRE).forEach(n=>{
 const b=document.createElement('button');b.textContent=n;
 b.onclick=()=>{Object.assign(S,PRE[n]);syncUI();resize()};
 $('#pre').appendChild(b);
});
$('#cfg').onclick=()=>{$('#panel').classList.toggle('open');$('#cfg').classList.toggle('on')};
$('#fmt').onclick=()=>{if(rec)return;S.fmt=(S.fmt+1)%FMT.length;resize()};

/* Archivos y vista previa */
function save(blob,name){
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),20000);
}
let curBlob=null;
function preview(blob,name,isVid){
 curBlob=blob;blobName=name;
 if(blobUrl)URL.revokeObjectURL(blobUrl);
 blobUrl=URL.createObjectURL(blob);
 $('#pc').innerHTML=isVid?`<video src="${blobUrl}" controls playsinline autoplay loop></video>`:`<img src="${blobUrl}" alt="Foto capturada">`;
 $('#prev').classList.add('on');
}
$('#sv').onclick=()=>curBlob&&save(curBlob,blobName);
$('#cl').onclick=()=>{$('#prev').classList.remove('on');$('#pc').innerHTML='';if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null}};
const stamp=()=>new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);

/* Foto */
$('#shut').onclick=()=>{
 const f=$('#flash');f.style.transition='none';f.style.opacity=.8;
 requestAnimationFrame(()=>{f.style.transition='opacity .25s';f.style.opacity=0});
 out.toBlob(b=>{if(!b)return;const n='retro-'+stamp()+'.png';save(b,n);preview(b,n,false)},'image/png');
};

/* Video */
function pickMime(){
 if(!window.MediaRecorder)return null;
 const c=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'];
 return c.find(m=>MediaRecorder.isTypeSupported(m))||'';
}
function lofiTrack(){
 actx=new (window.AudioContext||window.webkitAudioContext)();
 actx.resume();
 const src=actx.createMediaStreamSource(new MediaStream([atrack]));
 const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=350;
 const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;lp.Q.value=2;
 const cp=actx.createDynamicsCompressor();cp.threshold.value=-30;cp.ratio.value=8;
 const gn=actx.createGain();gn.gain.value=1.6;
 const dst=actx.createMediaStreamDestination();
 src.connect(hp);hp.connect(lp);lp.connect(cp);cp.connect(gn);gn.connect(dst);
 return dst.stream.getAudioTracks()[0];
}
function fmtT(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}
function startRec(){
 const mime=pickMime();
 if(mime===null){msg('Este navegador no soporta MediaRecorder.');return}
 const tracks=[...out.captureStream(24).getVideoTracks()];
 if(atrack)tracks.push($('#lofi').checked?lofiTrack():atrack);
 chunks=[];
 try{rec=new MediaRecorder(new MediaStream(tracks),mime?{mimeType:mime,videoBitsPerSecond:5e6}:undefined)}
 catch(e){msg('No se pudo iniciar la grabación: '+e.message);return}
 const type=rec.mimeType||mime||'video/webm';
 rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 rec.onstop=()=>{
  clearInterval(timer);
  if(actx){actx.close();actx=null}
  $('#hud').classList.remove('on');$('#rec').classList.remove('on');$('#rec').textContent='Grabar';$('#fmt').disabled=false;
  const ext=type.includes('mp4')?'mp4':'webm';
  const blob=new Blob(chunks,{type:type.split(';')[0]});
  rec=null;
  if(!blob.size){msg('La grabación quedó vacía.');return}
  const n='retro-'+stamp()+'.'+ext;
  save(blob,n);preview(blob,n,true);
 };
 rec.start(500);
 recT0=Date.now();
 $('#hud').classList.add('on');$('#rec').classList.add('on');$('#rec').textContent='Detener';$('#fmt').disabled=true;
 $('#tm').textContent='00:00 / 00:30';
 timer=setInterval(()=>{
  const s=(Date.now()-recT0)/1000;
  $('#tm').textContent=fmtT(s)+' / 00:30';
  if(s>=30)stopRec();
 },250);
 if(!atrack)msg('Grabando sin audio.',3000);
}
function stopRec(){if(rec&&rec.state!=='inactive')rec.stop()}
$('#rec').onclick=()=>rec?stopRec():startRec();

/* Inicio */
resize();syncUI();frame();
(async()=>{await startCam();await startMic()})();
addEventListener('orientationchange',()=>setTimeout(()=>{if(!rec){S.fmt=innerHeight>innerWidth?0:1;resize()}},300));
</script>
</body>
</html>
